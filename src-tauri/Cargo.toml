[package]
name = "deskmate"
version = "0.1.0"
description = "A pixel desk pet that shows what your coding agent is doing"
authors = ["deskmate contributors"]
license = "MIT"
repository = "https://github.com/nifabulous/deskmate"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
strip = true
lto = true
codegen-units = 1
